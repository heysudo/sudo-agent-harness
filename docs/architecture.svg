<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrRose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#020617"/>
  <rect width="1240" height="900" fill="url(#grid)"/>

  <text x="40" y="42" fill="#e2e8f0" font-size="20" font-weight="bold">HERMIT — voice agent on a 1 GB Raspberry Pi</text>
  <text x="40" y="62" fill="#64748b" font-size="11">every arrow exists to protect one number: the silence between "you stop talking" and "it starts answering"</text>

  <!-- ================= arrows (drawn early, behind boxes) ================= -->
  <!-- mic chain -->
  <line x1="130" y1="180" x2="130" y2="240" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <line x1="220" y1="300" x2="320" y2="300" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <!-- speaker return -->
  <line x1="320" y1="330" x2="220" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="360" x2="130" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- daemon pipeline -->
  <line x1="475" y1="210" x2="510" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="665" y1="210" x2="700" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="242" x2="775" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="332" x2="665" y2="332" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="332" x2="475" y2="332" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="242" x2="590" y2="300" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <!-- daemon to cloud -->
  <line x1="850" y1="322" x2="920" y2="170" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="850" y1="332" x2="920" y2="250" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="850" y1="342" x2="920" y2="410" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- sidecars to cloud -->
  <line x1="850" y1="600" x2="920" y2="640" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="850" y1="590" x2="920" y2="560" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="850" y1="580" x2="920" y2="490" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- daemon to sidecars -->
  <line x1="420" y1="420" x2="400" y2="560" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="420" x2="560" y2="560" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrRose)"/>
  <line x1="700" y1="560" x2="680" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================= hardware column ================= -->
  <text x="40" y="105" fill="#22d3ee" font-size="10" letter-spacing="2">HARDWARE — DSP BEFORE SOFTWARE</text>
  <rect x="40" y="120" width="180" height="60" fill="#0f172a" rx="6"/>
  <rect x="40" y="120" width="180" height="60" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" rx="6"/>
  <text x="130" y="145" fill="#e2e8f0" font-size="12" text-anchor="middle">4-mic strip</text>
  <text x="130" y="162" fill="#94a3b8" font-size="9" text-anchor="middle">FPC ribbon</text>

  <rect x="40" y="240" width="180" height="120" fill="#0f172a" rx="6"/>
  <rect x="40" y="240" width="180" height="120" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
  <text x="130" y="265" fill="#e2e8f0" font-size="12" text-anchor="middle">XVF3800</text>
  <text x="130" y="282" fill="#94a3b8" font-size="9" text-anchor="middle">AEC · beamforming · NS</text>
  <text x="130" y="296" fill="#94a3b8" font-size="9" text-anchor="middle">dereverb · AGC · VAD · DoA</text>
  <text x="130" y="314" fill="#fbbf24" font-size="9" text-anchor="middle">all in silicon @ 16 kHz</text>
  <text x="130" y="332" fill="#64748b" font-size="8" text-anchor="middle">one card = AEC always has its</text>
  <text x="130" y="343" fill="#64748b" font-size="8" text-anchor="middle">loopback ref → barge-in works</text>

  <rect x="40" y="430" width="180" height="60" fill="#0f172a" rx="6"/>
  <rect x="40" y="430" width="180" height="60" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" rx="6"/>
  <text x="130" y="455" fill="#e2e8f0" font-size="12" text-anchor="middle">3 W speaker</text>
  <text x="130" y="472" fill="#94a3b8" font-size="9" text-anchor="middle">DFRobot FIT0502, 8 Ω</text>
  <text x="245" y="290" fill="#22d3ee" font-size="8">USB</text>
  <text x="243" y="322" fill="#64748b" font-size="8">UAC2</text>

  <!-- ================= Pi boundary ================= -->
  <rect x="300" y="90" width="560" height="700" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4" rx="12"/>
  <text x="320" y="112" fill="#fbbf24" font-size="10" letter-spacing="2">RASPBERRY PI 4 — 1 GB RAM, NOTHING HEAVY ALLOWED</text>

  <!-- daemon boundary -->
  <rect x="320" y="130" width="520" height="310" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" rx="8"/>
  <text x="335" y="150" fill="#34d399" font-size="10">hermit — one 9 MB Rust binary (tokio, edition 2024)</text>

  <rect x="335" y="178" width="140" height="64" fill="#0f172a" rx="6"/>
  <rect x="335" y="178" width="140" height="64" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="405" y="202" fill="#e2e8f0" font-size="12" text-anchor="middle">audio</text>
  <text x="405" y="217" fill="#94a3b8" font-size="9" text-anchor="middle">plain ALSA · keepalive</text>
  <text x="405" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">instant barge-in flush</text>

  <rect x="510" y="178" width="155" height="64" fill="#0f172a" rx="6"/>
  <rect x="510" y="178" width="155" height="64" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="587" y="202" fill="#e2e8f0" font-size="12" text-anchor="middle">wake</text>
  <text x="587" y="217" fill="#94a3b8" font-size="9" text-anchor="middle">"Hey Sudo" ONNX ×3</text>
  <text x="587" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">strided; dlopen'd ORT</text>

  <rect x="700" y="178" width="140" height="64" fill="#0f172a" rx="6"/>
  <rect x="700" y="178" width="140" height="64" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="770" y="202" fill="#e2e8f0" font-size="12" text-anchor="middle">router</text>
  <text x="770" y="217" fill="#94a3b8" font-size="9" text-anchor="middle">regex fast path ~1 ms</text>
  <text x="770" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">no LLM for switches</text>

  <rect x="335" y="300" width="140" height="64" fill="#0f172a" rx="6"/>
  <rect x="335" y="300" width="140" height="64" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
  <text x="405" y="324" fill="#e2e8f0" font-size="12" text-anchor="middle">speech</text>
  <text x="405" y="339" fill="#94a3b8" font-size="9" text-anchor="middle">persistent websockets</text>
  <text x="405" y="352" fill="#94a3b8" font-size="9" text-anchor="middle">sentence chunker</text>

  <rect x="510" y="300" width="155" height="64" fill="#0f172a" rx="6"/>
  <rect x="510" y="300" width="155" height="64" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="587" y="324" fill="#e2e8f0" font-size="12" text-anchor="middle">orchestrator</text>
  <text x="587" y="339" fill="#94a3b8" font-size="9" text-anchor="middle">hard 2-round tool cap</text>
  <text x="587" y="352" fill="#94a3b8" font-size="9" text-anchor="middle">streams while generating</text>

  <rect x="700" y="300" width="140" height="64" fill="#0f172a" rx="6"/>
  <rect x="700" y="300" width="140" height="64" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
  <text x="770" y="324" fill="#e2e8f0" font-size="12" text-anchor="middle">memory</text>
  <text x="770" y="339" fill="#94a3b8" font-size="9" text-anchor="middle">SQLite FTS5 · BM25</text>
  <text x="770" y="352" fill="#94a3b8" font-size="9" text-anchor="middle">reflection-only writes</text>

  <text x="580" y="390" fill="#fb7185" font-size="9" text-anchor="middle">memory firewall: no API can write raw text as a fact —</text>
  <text x="580" y="403" fill="#fb7185" font-size="9" text-anchor="middle">tool output structurally cannot reach the reflection transcript</text>
  <text x="580" y="425" fill="#64748b" font-size="9" text-anchor="middle">mic → wake → STT → router → (LLM if needed) → chunker → TTS → ALSA, all streaming</text>

  <!-- sidecars -->
  <rect x="335" y="560" width="120" height="70" fill="#0f172a" rx="6"/>
  <rect x="335" y="560" width="120" height="70" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5" rx="6"/>
  <text x="395" y="585" fill="#e2e8f0" font-size="12" text-anchor="middle">mpv</text>
  <text x="395" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">radio + YouTube</text>
  <text x="395" y="613" fill="#94a3b8" font-size="9" text-anchor="middle">JSON IPC socket</text>

  <rect x="470" y="560" width="120" height="70" fill="#0f172a" rx="6"/>
  <rect x="470" y="560" width="120" height="70" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5" rx="6"/>
  <text x="530" y="585" fill="#e2e8f0" font-size="12" text-anchor="middle">librespot</text>
  <text x="530" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">Spotify Connect</text>
  <text x="530" y="613" fill="#94a3b8" font-size="9" text-anchor="middle">endpoint</text>

  <rect x="605" y="560" width="125" height="70" fill="#0f172a" rx="6"/>
  <rect x="605" y="560" width="125" height="70" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5" rx="6"/>
  <text x="667" y="585" fill="#e2e8f0" font-size="12" text-anchor="middle">sudo-console</text>
  <text x="667" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">curses TUI · meters</text>
  <text x="667" y="613" fill="#94a3b8" font-size="9" text-anchor="middle">TTL mute leases</text>

  <rect x="745" y="560" width="95" height="70" fill="#0f172a" rx="6"/>
  <rect x="745" y="560" width="95" height="70" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="792" y="585" fill="#e2e8f0" font-size="12" text-anchor="middle">tailscaled</text>
  <text x="792" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">isolated svc</text>
  <text x="792" y="613" fill="#94a3b8" font-size="9" text-anchor="middle">mgmt path</text>

  <text x="580" y="660" fill="#64748b" font-size="9" text-anchor="middle">every audio source — speech, radio, Spotify, YouTube — sums through the ONE sound card,</text>
  <text x="580" y="673" fill="#64748b" font-size="9" text-anchor="middle">so the hardware echo canceller always hears what the speaker plays: wake word interrupts music</text>
  <text x="580" y="695" fill="#64748b" font-size="9" text-anchor="middle">console ↔ daemon coupling is files in /run, not RPC: telemetry out, mute-lease + volume-command in;</text>
  <text x="580" y="708" fill="#64748b" font-size="9" text-anchor="middle">a crashed console auto-unmutes in 3 s. systemd sidecars restart independently of the daemon.</text>
  <text x="580" y="730" fill="#fbbf24" font-size="9" text-anchor="middle">locked: no Python/Node in the hot path · no PulseAudio/PipeWire · no Docker · no local models beyond wake ·</text>
  <text x="580" y="743" fill="#fbbf24" font-size="9" text-anchor="middle">never compile on the Pi (arm64 container builds on the dev machine)</text>

  <!-- ================= cloud boundary ================= -->
  <rect x="900" y="90" width="300" height="700" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,4" rx="12"/>
  <text x="920" y="112" fill="#94a3b8" font-size="10" letter-spacing="2">CLOUD — RENTED BRAINS, PRE-WARMED</text>

  <rect x="920" y="130" width="260" height="64" fill="#0f172a" rx="6"/>
  <rect x="920" y="130" width="260" height="64" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="1050" y="154" fill="#e2e8f0" font-size="12" text-anchor="middle">Cerebras — gpt-oss-120b</text>
  <text x="1050" y="169" fill="#94a3b8" font-size="9" text-anchor="middle">streaming tokens · first token 366 ms p50</text>
  <text x="1050" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">warm pool saves ~130 ms vs cold TLS</text>

  <rect x="920" y="214" width="260" height="64" fill="#0f172a" rx="6"/>
  <rect x="920" y="214" width="260" height="64" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
  <text x="1050" y="238" fill="#e2e8f0" font-size="12" text-anchor="middle">Sarvam — saaras STT · bulbul TTS</text>
  <text x="1050" y="253" fill="#94a3b8" font-size="9" text-anchor="middle">auto language: or-IN / hi-IN / en-IN</text>
  <text x="1050" y="266" fill="#94a3b8" font-size="9" text-anchor="middle">acks follow the user's last language</text>

  <rect x="920" y="298" width="260" height="50" fill="#0f172a" rx="6"/>
  <rect x="920" y="298" width="260" height="50" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
  <text x="1050" y="320" fill="#e2e8f0" font-size="12" text-anchor="middle">Deepgram / Cartesia</text>
  <text x="1050" y="336" fill="#94a3b8" font-size="9" text-anchor="middle">English-stack alternates (config switch)</text>

  <rect x="920" y="368" width="260" height="64" fill="#0f172a" rx="6"/>
  <rect x="920" y="368" width="260" height="64" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
  <text x="1050" y="392" fill="#e2e8f0" font-size="12" text-anchor="middle">Parallel · Firecrawl</text>
  <text x="1050" y="407" fill="#94a3b8" font-size="9" text-anchor="middle">turbo search ~200 ms (advanced = 3 s,</text>
  <text x="1050" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">config refuses to start with it)</text>

  <rect x="920" y="452" width="260" height="56" fill="#0f172a" rx="6"/>
  <rect x="920" y="452" width="260" height="56" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="1050" y="474" fill="#e2e8f0" font-size="12" text-anchor="middle">Spotify Web API</text>
  <text x="1050" y="490" fill="#94a3b8" font-size="9" text-anchor="middle">search + Connect control (Premium)</text>

  <rect x="920" y="528" width="260" height="56" fill="#0f172a" rx="6"/>
  <rect x="920" y="528" width="260" height="56" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5" rx="6"/>
  <text x="1050" y="550" fill="#e2e8f0" font-size="12" text-anchor="middle">YouTube (yt-dlp)</text>
  <text x="1050" y="566" fill="#94a3b8" font-size="9" text-anchor="middle">fallback when Spotify DRM refuses keys</text>

  <rect x="920" y="604" width="260" height="56" fill="#0f172a" rx="6"/>
  <rect x="920" y="604" width="260" height="56" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5" rx="6"/>
  <text x="1050" y="626" fill="#e2e8f0" font-size="12" text-anchor="middle">All India Radio streams</text>
  <text x="1050" y="642" fill="#94a3b8" font-size="9" text-anchor="middle">232-station Akashvani catalogue</text>

  <text x="1050" y="700" fill="#64748b" font-size="9" text-anchor="middle">playback truth is verified by PROGRESS,</text>
  <text x="1050" y="713" fill="#64748b" font-size="9" text-anchor="middle">not status flags — a stalled receiver that</text>
  <text x="1050" y="726" fill="#64748b" font-size="9" text-anchor="middle">reports "playing" triggers the fallback</text>

  <!-- ================= legend (outside all boundaries) ================= -->
  <g font-size="9">
    <rect x="40" y="830" width="12" height="12" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="58" y="840" fill="#94a3b8">audio I/O</text>
    <rect x="140" y="830" width="12" height="12" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="158" y="840" fill="#94a3b8">agent core / LLM</text>
    <rect x="290" y="830" width="12" height="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/><text x="308" y="840" fill="#94a3b8">speech &amp; memory</text>
    <rect x="450" y="830" width="12" height="12" fill="rgba(251,146,60,0.3)" stroke="#fb923c"/><text x="468" y="840" fill="#94a3b8">media</text>
    <rect x="540" y="830" width="12" height="12" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/><text x="558" y="840" fill="#94a3b8">operator / guarded</text>
    <rect x="700" y="830" width="12" height="12" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/><text x="718" y="840" fill="#94a3b8">hardware DSP / search</text>
    <text x="900" y="840" fill="#475569">dashed rose = lease · dashed violet = reflection-only</text>
  </g>
</svg>
