# HERMIT configuration.
#
# Everything here is hot-reloaded: the daemon watches this directory and swaps the
# new config in on write. No rebuild, no restart. A broken edit is logged and the
# previous config stays live.
#
# Secrets are NOT here. They come from /etc/hermit/hermit.env (see .env.example).

[server]
ws_bind = "127.0.0.1:8765"   # loopback only; text clients connect here
cli = true                   # read turns from stdin (used by scripts/bench.sh)

[paths]
data_dir = "/var/lib/hermit"        # SQLite + the learned core.md
config_dir = "/opt/hermit/config"   # this tree
ack_dir = "/var/lib/hermit/acks"    # persistent; tmpfs is wiped on reboot and a
                                    # cold boot races the network, losing every ack

[llm]
base_url = "https://api.cerebras.ai/v1"
model = "gpt-oss-120b"
reasoning_effort_default = "low"      # everything interactive
reasoning_effort_research = "medium"  # research-classified queries only
max_tokens = 1024
temperature = 0.6
max_tool_rounds = 2                   # HARD CAP; more becomes background_research
request_timeout_ms = 30000

[search]
base_url = "https://api.parallel.ai"
# MUST stay "turbo". The API defaults to "advanced" (~3s) when mode is unset;
# turbo is ~200ms. config::validate refuses to start if this is changed.
mode = "turbo"
fallback_mode = "basic"   # turbo is English+Japanese only
max_results = 5
timeout_ms = 4000

[fetch]
base_url = "https://api.firecrawl.dev"
timeout_ms = 15000
max_tokens = 4000         # hard cap on page text handed to the model

[news]
items_per_feed = 6
target_words = [150, 250]
timeout_ms = 5000

[[news.feeds]]
name = "BBC"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"

[[news.feeds]]
name = "NPR"
url = "https://feeds.npr.org/1001/rss.xml"

[[news.feeds]]
name = "Reuters"
url = "https://www.reutersagency.com/feed/?best-topics=top-news&post_type=best"

[music]
mpv_socket = "/run/hermit/mpv.sock"
librespot_device_name = "Hermit"
spotify_api_base = "https://api.spotify.com/v1"
stations_file = "stations.toml"
default_volume = 70

[tts]
provider = "sarvam"               # "cartesia" | "elevenlabs" | "piper" | "sarvam"
cartesia_url = "wss://api.cartesia.ai/tts/websocket"
cartesia_model = "sonic-3"
cartesia_voice_id = "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"   # Skylar (en-US, public)
cartesia_version = "2026-08-14"
# The provider default is 3000ms, which alone exceeds the 1.2s first-audio gate.
# Validation refuses any value but 0.
cartesia_max_buffer_delay_ms = 0
elevenlabs_url = "wss://api.elevenlabs.io/v1/text-to-speech"
elevenlabs_model = "eleven_flash_v2_5"
elevenlabs_voice_id = ""
# Set from Phase 0: the card's NATIVE playback rate. Matching it means zero
# resampling on the Pi.
sample_rate = 16000
piper_binary = "/usr/local/bin/piper"
piper_voice = "/opt/hermit/config/voices/en_US-lessac-low.onnx"
connect_timeout_ms = 3000
sarvam_tts_url = "wss://api.sarvam.ai/text-to-speech/ws"
# Bulbul v3 wants "od-IN" for Odia; the STT service wants "or-IN" for the SAME
# language. Sarvam is inconsistent between its own services. Both verified live.
# DEFAULT voice language: used when per-turn detection has nothing (boot
# announcements, undetected turns). Per-turn replies and acks follow the
# language of the user's LAST utterance (auto-detected by STT).
sarvam_tts_language = "en-IN"
sarvam_tts_voice = "shubh"         # every spoken word from the device, incl. acks

[stt]
# "sarvam" — Hindi / Odia / Indian-English. "deepgram" — English only.
provider = "sarvam"

# --- Sarvam Saaras v3 realtime ---
sarvam_url = "wss://api.sarvam.ai/speech-to-text-realtime/ws"
sarvam_language = "auto"        # per-turn detection; TTS replies in the detected language
sarvam_stream_type = "fast"     # lowest-latency partials for conversational voice
sarvam_silence_ms = 500         # server VAD pause before finalizing
sarvam_vad_threshold = 0.15     # default 0.3 misses the XVF3800's quiet output
sarvam_gain = 8.0               # software boost: ~-35 dBFS speech -> ~-17 dBFS
max_utterance_ms = 8000

# --- Deepgram (fallback; set provider = "deepgram" to switch back) ---
url = "wss://api.deepgram.com/v1/listen"
model = "nova-3"
language = "en-US"
endpointing_ms = 300
sample_rate = 16000

[wake]
enabled = true
# The active engine is the project's own "Hey Sudo" model (three ONNX graphs in
# /opt/hermit/models). `keyword` below only matters for the Porcupine fallback.
keyword = "computer"     # Porcupine fallback only
# keyword_path = "/opt/hermit/models/hey_sudo.onnx"   # override the classifier
# For hey-sudo this is the DETECTION THRESHOLD (0..1), not a Porcupine sensitivity.
# 0.5 is the livekit-wakeword / openWakeWord reference default. Lower = more
# sensitive and more false accepts. Tune with: hermit wake-score <recording.wav>
sensitivity = 0.5

[audio]
playback_pcm = "hermit_out"   # defined in /etc/asound.conf
capture_pcm = "hermit_in"     # XVF3800 processed voice channel
sample_rate = 16000
buffer_ms = 200               # small: barge-in flushes what the driver holds
period_ms = 20
duck_db = -12.0               # music attenuation while speaking
# REQUIRED on the XVF3800: its USB capture clock is slaved to the playback stream,
# so the microphone returns EIO whenever playback goes idle. Measured on hardware.
# Setting this false makes the device deaf. See src/audio/mod.rs::spawn_keepalive.
keepalive_silence = true

[memory]
core_token_cap = 600          # hard cap on core.md
recall_facts = 5
recall_skills = 2
importance_decay = 0.98       # applied nightly
prune_below = 0.15
history_turns = 12
dedupe_similarity = 0.8       # token containment above which a fact is a duplicate

[reflect]
enabled = true
turns_per_nudge = 6
idle_secs = 60
skill_creation = true

[research]
max_rounds = 8                # off the hot path
timeout_secs = 300
speak_on_complete = true
