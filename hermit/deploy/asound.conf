##############################################################################
# HERMIT — ALSA system configuration.  Installed by provision.sh to /etc/asound.conf
#
# Topology (LOCKED — do not change):
#
#   The reSpeaker Flex XVF3800 in USB (UAC 2.0) mode is the Pi's ONE sound card.
#   Microphone capture AND every byte of playback (TTS, librespot/Spotify, mpv
#   radio) go through it.  That is deliberate: the XVF3800 does acoustic echo
#   cancellation in hardware, and it can only cancel what it played itself.
#   Keeping playback on the same card guarantees the AEC always has a valid
#   loopback reference, which is what makes barge-in work — the wake word is
#   still heard while music or TTS is playing.
#
#   No PulseAudio.  No PipeWire.  No dsp server of any kind.  Plain alsa-lib.
#
# Signal chain, playback (top = what an application opens):
#
#   application (any rate/format/channels)
#     -> plug          format / rate / channel conversion
#       -> softvol     "Hermit Master", HARD CEILING at -2.5 dBFS (see below)
#         -> route     stereo -> mono downmix
#           -> dmix    software mixer, lets hermit + librespot + mpv share the card
#             -> hw    the XVF3800 USB card
#
# Signal chain, capture:
#
#   application
#     <- plug          rate / format conversion (48k card -> 16k daemon, if needed)
#       <- route       pick ONE channel out of the 2-channel USB capture stream
#         <- dsnoop    lets the daemon and a debugging arecord read at once
#           <- hw      the XVF3800 USB card
#
# Named PCMs defined by this file:
#
#   default       asym: playback = hermit_out, capture = hermit_in.  Everything
#                 that does not name a device (aplay, mpv, librespot) lands here.
#   hermit_out    playback, volume-limited.  The daemon opens this by name.
#   hermit_in     capture, channel 0 = XVF3800 processed mono voice.  Daemon opens this.
#   capture_ref   capture, channel 1 = AEC reference / second processed stream.
#                 Debugging and the Phase 0 AEC test only.  Not used at runtime.
#   hermit_raw    playback WITHOUT the softvol ceiling.  Measurement only —
#                 this can drive the amplifier to full scale and exceed the
#                 3 W rating of the speaker.  Never point the daemon at it.
#
# WHY THE CEILING EXISTS — READ BEFORE RAISING IT:
#   The Flex core board's amplifier is rated 10 W into 4 ohm.  Into the 8 ohm
#   DFRobot FIT0502 that is roughly 5 W available.  The FIT0502 is rated 3 W.
#   sqrt(3/5) = 0.775 of full-scale amplitude = -2.2 dBFS, so the softvol
#   max_dB below is set to -2.5 dBFS.  At the maximum setting of the "Hermit
#   Master" control the speaker still cannot be driven past its rating.
#   Raising max_dB toward 0 will cook the voice coil.  Don't.
#
# FIDELITY, stated plainly:
#   This is a 16 kHz voice-grade pipeline into a 3 W mono driver.  It is fine
#   for speech, news and casual music.  It is not hi-fi and it is not supposed
#   to be.  Nothing here is to be "fixed" by adding a DAC, an amp, or the Pi's
#   3.5 mm jack — that would break hardware AEC and therefore break barge-in.
#
##############################################################################


##############################################################################
#                                                                            #
#   >>>>>>>>>>>>>>>  OPERATOR ADJUSTMENT BLOCK — EDIT HERE  <<<<<<<<<<<<<<<   #
#                                                                            #
#   These are the ONLY values you should ever need to touch.  Everything      #
#   below this block refers back to them; nothing else hardcodes a card       #
#   index or a sample rate.                                                   #
#                                                                            #
#   1) hermit.card   — REQUIRED.  Run:                                        #
#                          aplay -l                                           #
#                          cat /proc/asound/cards                             #
#                      and use the SHORT NAME in square brackets, e.g. a line #
#                      like  `card 0: Flex [ReSpeaker Flex], device 0: ...`   #
#                      means hermit.card is "Flex".  Prefer the name over the #
#                      number: USB enumeration order is not stable across     #
#                      reboots, the name is.  A bare integer also works if    #
#                      you must ("0"), but you have been warned.              #
#                                                                            #
#   2) hermit.rate   — REQUIRED.  Run:                                        #
#                          aplay  -D hw:CARD=<name>,0 --dump-hw-params /dev/zero  #
#                          arecord -D hw:CARD=<name>,0 --dump-hw-params -d 1 /dev/null #
#                      and read the RATE line.  Set this to the card's NATIVE #
#                      rate.  If the card only offers 16000, put 16000.  If   #
#                      it offers 48000 (with or without 16000), put 48000.    #
#                      Getting this wrong does not break audio — `plug` will  #
#                      paper over it — but it costs you a pointless resample. #
#                      Record the answer in docs/BRINGUP.md: it also decides  #
#                      whether the TTS provider is asked for 16 kHz or 48 kHz.#
#                                                                            #
#   3) hermit.format / hermit.play_channels — only if --dump-hw-params        #
#                      disagrees with the defaults below (S16_LE, 2 channels).#
#                      If FORMAT lists only S32_LE, set S32_LE.  If CHANNELS  #
#                      says only 1, set play_channels to 1 AND switch the     #
#                      downmix ttable in pcm.hermit_downmix to the mono       #
#                      variant that is commented out there.                   #
#                                                                            #
#   4) hermit.period_size / hermit.buffer_size — scale with the rate.  Two    #
#                      known-good pairs are given; uncomment the matching one.#
#                                                                            #
##############################################################################

# MEASURED ON HARDWARE 2026-08-18 on the reference device. Do not guess these again; they
# came from --dump-hw-params on the actual board:
#
#   card 1: Array [reSpeaker XVF3800 4-Mic Array]
#   Playback: S16_LE, CHANNELS 2, RATE 16000 (the ONLY rate offered)
#   Capture : S16_LE, CHANNELS 2, RATE 16000 (the ONLY rate offered)
#
# The card offers 16 kHz and nothing else, in both directions. That is the best
# possible case: we also request 16 kHz PCM from the TTS provider, so NOTHING in
# the chain resamples — no `plug` conversion, no CPU burned, no added latency.
hermit.card "Array"         # <-- 1) card SHORT NAME from `aplay -l`
hermit.rate 16000           # <-- 2) native rate — 16 kHz is all this board offers
hermit.format S16_LE        # <-- 3) sample format from --dump-hw-params
hermit.play_channels 2      # <-- 3) playback channel count from --dump-hw-params

# 4) Latency knobs.  period = the granularity of the mixer wake-up, buffer =
#    total slack before an underrun.  Smaller is lower latency and more xruns.
#    ---- for hermit.rate 16000 : 10 ms period / 60 ms buffer ---- (ACTIVE)
hermit.period_size 160
hermit.buffer_size 960
#    ---- for hermit.rate 48000 : 10 ms period / 60 ms buffer ----
#    (only if a future firmware exposes 48 kHz; swap the pair above for these)
# hermit.period_size 480
# hermit.buffer_size 2880

##############################################################################
#                    END OF OPERATOR ADJUSTMENT BLOCK                        #
##############################################################################


# ---------------------------------------------------------------------------
# Raw hardware handles.  `type hw` is the bare device: no conversion, exclusive
# access.  Nothing but dmix/dsnoop should ever open these directly.
# `@func refer` pulls the value out of the adjustment block above so the card
# name and rate live in exactly one place in this file.
# ---------------------------------------------------------------------------

pcm.hermit_hw_out {
    type hw
    card { @func refer name hermit.card }
    device 0
    # nonblock is left at the default; the daemon manages its own scheduling.
}

pcm.hermit_hw_in {
    type hw
    card { @func refer name hermit.card }
    device 0
}


# ---------------------------------------------------------------------------
# PLAYBACK STAGE 1 (bottom of the chain): dmix — the software mixer.
#
# The XVF3800 exposes a single playback substream, so without dmix the first
# process to open it locks everyone else out.  Hermit's TTS, librespot and mpv
# all need to play, sometimes at the same time (a TTS answer ducking over
# music), so dmix is mandatory, not optional.
#
# dmix does NOT resample.  It runs at exactly the slave rate below, which is
# why hermit.rate must be the card's native rate and why every consumer sits
# behind a `plug`.
#
# ipc_key must be unique per shared PCM on the machine.  ipc_gid audio +
# ipc_perm 0660 means every member of the `audio` group (the hermit user,
# librespot, mpv) attaches to the SAME mixing instance instead of each
# creating its own and fighting over the card.
# ---------------------------------------------------------------------------

pcm.hermit_dmix {
    type dmix
    ipc_key 31415
    ipc_perm 0660
    ipc_gid audio          # if your alsa-lib rejects the group name, use the
                           # numeric gid of `audio` (`getent group audio`).
    slave {
        pcm "hermit_hw_out"
        rate        { @func refer name hermit.rate }
        format      { @func refer name hermit.format }
        channels    { @func refer name hermit.play_channels }
        period_size { @func refer name hermit.period_size }
        buffer_size { @func refer name hermit.buffer_size }
    }
}


# ---------------------------------------------------------------------------
# PLAYBACK STAGE 2: route — stereo to mono downmix.
#
# There is ONE speaker.  If a stereo source is handed to a 2-channel card
# untouched, half the mix goes to a channel nobody can hear (and on some
# XVF3800 firmware builds, to the aux jack only).  Anything panned hard right
# would simply vanish.  So both input channels are summed at 0.5 each and the
# identical mono sum is written to both slave channels.
#
# 0.5 + 0.5 = unity for correlated (centre) content and -3 dB for uncorrelated
# content, which is the conventional, non-clipping downmix.  Do not raise these
# to 1.0: a hard-panned mix would then sum to +6 dB and clip inside dmix.
#
# ttable.<input>.<output>: for playback, input = client channel, output = slave.
# ---------------------------------------------------------------------------

pcm.hermit_downmix {
    type route
    slave.pcm "hermit_dmix"
    slave.channels { @func refer name hermit.play_channels }

    # ---- stereo card (hermit.play_channels 2) — THE DEFAULT ----
    ttable.0.0 0.5      # client L -> slave L
    ttable.0.1 0.5      # client L -> slave R
    ttable.1.0 0.5      # client R -> slave L
    ttable.1.1 0.5      # client R -> slave R

    # ---- mono card (hermit.play_channels 1) ----
    # Comment out the four lines above and uncomment these two:
    # ttable.0.0 0.5    # client L -> the one slave channel
    # ttable.1.0 0.5    # client R -> the one slave channel
}


# ---------------------------------------------------------------------------
# PLAYBACK STAGE 3: softvol — the speaker protection ceiling.
#
# softvol creates an ALSA mixer control ("Hermit Master") on the card and
# applies it in software.  The important line is max_dB: it is the gain at the
# control's MAXIMUM setting.  At -2.5 dBFS, even with the control pegged at
# 100% and the hardware PCM control at 100%, the amplifier cannot be asked for
# more than ~0.75 of full scale — about 2.8 W into the 8 ohm FIT0502, inside
# its 3 W rating.  See the header for the arithmetic.
#
# min_dB -51 dB gives a usable range for "quiet in the evening" without the
# control collapsing to silence over the last few percent.
# resolution 100 makes the control read 0..100, i.e. percent, in alsamixer.
#
# provision.sh sets this control to 100% and persists it with `alsactl store`.
# ---------------------------------------------------------------------------

pcm.hermit_softvol {
    type softvol
    slave.pcm "hermit_downmix"
    control {
        name "Hermit Master"
        card { @func refer name hermit.card }
    }
    min_dB -51.0
    max_dB  -2.5        # <-- SPEAKER PROTECTION.  Do not move toward 0.
    resolution 100
}


# ---------------------------------------------------------------------------
# PLAYBACK ENTRY POINT: hermit_out
#
# `plug` is the conversion shim: it accepts whatever rate, format and channel
# count the caller has (Cartesia 16 kHz mono PCM, librespot 44.1 kHz stereo,
# mpv's 48 kHz stereo radio) and converts it to what dmix demands.  Without
# this, a 44.1 kHz Spotify stream would simply fail to open.
#
# THIS IS THE NAME THE DAEMON OPENS.  It matches the `audio.playback_pcm`
# default in src/config.rs.
# ---------------------------------------------------------------------------

pcm.hermit_out {
    type plug
    slave.pcm "hermit_softvol"
}


# ---------------------------------------------------------------------------
# MEASUREMENT ONLY: hermit_raw
#
# Identical to hermit_out but with the softvol stage removed, so 0 dBFS in is
# 0 dBFS out.  Use it when you need to know the true electrical output — SPL
# measurements, checking for amplifier clipping, verifying the ceiling is
# actually doing something (play the same file through both and compare).
#
# WARNING: full scale here can exceed the 3 W rating of the FIT0502.  Short
# test tones at moderate levels only.  Never configure the daemon, librespot
# or mpv to use this PCM.
# ---------------------------------------------------------------------------

pcm.hermit_raw {
    type plug
    slave.pcm "hermit_downmix"
}


# ---------------------------------------------------------------------------
# CAPTURE STAGE 1: dsnoop — shared capture.
#
# Like dmix but for the input direction: it lets several readers pull from one
# capture substream.  Needed because the Phase 0 AEC test (docs/BRINGUP.md
# step 4) reads the processed channel and the reference channel at the same
# time, and because you will want to `arecord` for debugging while the daemon
# is running rather than stopping it.
#
# channels is fixed at 2: that is what the USB 2-channel firmware presents.
# If `arecord --dump-hw-params` reports 6 channels you flashed the WRONG
# firmware variant — see scripts/flash_notes.md.
# ---------------------------------------------------------------------------

pcm.hermit_dsnoop {
    type dsnoop
    ipc_key 31416
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hermit_hw_in"
        channels 2                                  # 2-ch USB firmware
        rate        { @func refer name hermit.rate }
        format      { @func refer name hermit.format }
        period_size { @func refer name hermit.period_size }
        buffer_size { @func refer name hermit.buffer_size }
    }
}


# ---------------------------------------------------------------------------
# CAPTURE STAGE 2 + ENTRY POINT: hermit_in — the processed voice channel.
#
# Channel 0 of the 2-channel USB firmware is the XVF3800's fully processed
# output: AEC, beamforming, noise suppression, dereverberation and AGC have
# already been applied on the XMOS chip.  This is the ONLY thing the wake word
# engine and the STT uploader should ever see.  The Pi does no DSP of its own.
#
# ttable.<input>.<output>: for CAPTURE the direction reverses — input is the
# slave (card) channel and output is the client channel.  So `ttable.1.0`
# below in capture_ref means "slave channel 1 becomes client channel 0".
# This is the one place in ALSA where the ttable indices read backwards from
# the playback case; it is correct as written.
#
# The outer `plug` converts the card's native rate to whatever the daemon asks
# for.  If hermit.rate is 48000 and the daemon wants 16 kHz mono S16_LE, this
# is where that resample happens.  If the card is natively 16 kHz it is a
# no-op passthrough.
#
# THIS IS THE NAME THE DAEMON OPENS.  It matches the `audio.capture_pcm`
# default in src/config.rs.
# ---------------------------------------------------------------------------

pcm.hermit_in {
    type plug
    slave.pcm {
        type route
        slave.pcm "hermit_dsnoop"
        slave.channels 2
        ttable.0.0 1        # card channel 0 (processed voice) -> client channel 0
    }
}


# ---------------------------------------------------------------------------
# DEBUG ONLY: capture_ref — channel 1 of the capture stream.
#
# On this firmware channel 1 carries the AEC reference (the loopback of what
# the card is playing).  It exists so that the Phase 0 AEC test can compare
# "what was played" against "what survived into the processed channel"; if the
# music is loud on capture_ref and strongly suppressed on hermit_in, the
# hardware AEC is working and barge-in will work.
#
# NOTE FOR BRING-UP: Seeed's firmware line has shipped more than one meaning
# for channel 1 across revisions (some 2-channel builds put a second processed
# beam here instead of the raw reference).  BRINGUP.md step 4 has you confirm
# empirically which one you have.  Either way the pass criterion is the same:
# channel 0 must be strongly suppressed relative to channel 1 while music
# plays.  Nothing at runtime depends on this PCM.
# ---------------------------------------------------------------------------

pcm.capture_ref {
    type plug
    slave.pcm {
        type route
        slave.pcm "hermit_dsnoop"
        slave.channels 2
        # ttable index order for a CAPTURE route is ttable.<client>.<slave>.
        # `ttable.1.0` (the intuitive-looking "slave 1 -> client 0") actually asks
        # for CLIENT channel 1, which does not exist on a mono open — the result is
        # a PCM that opens fine and returns pure silence. Verified on hardware
        # 2026-08-18: raw ch1 carried -43 dBFS while capture_ref read as silent.
        ttable.0.1 1        # client channel 0 <- card channel 1 (reference beam)
    }
}


# ---------------------------------------------------------------------------
# THE DEFAULT DEVICE.
#
# `asym` glues a playback PCM and a capture PCM into one name, so that any
# program that just opens "default" — aplay, speaker-test, mpv, librespot,
# shairport-sync — gets the volume-limited mono playback chain and the
# processed voice capture, with no per-program configuration anywhere.
#
# This is why the sidecars need no ALSA flags: `default` is already correct.
# ---------------------------------------------------------------------------

pcm.!default {
    type asym
    playback.pcm "hermit_out"
    capture.pcm  "hermit_in"
}


# ---------------------------------------------------------------------------
# The default MIXER (control) device — what `alsamixer`, `amixer` and
# `alsactl store` talk to when you do not pass -c.  Points at the same card,
# so the hardware "PCM-1"/"PCM" control and the softvol "Hermit Master"
# control both show up in one place.
# ---------------------------------------------------------------------------

ctl.!default {
    type hw
    card { @func refer name hermit.card }
}
