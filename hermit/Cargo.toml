[package]
name = "hermit"
version = "0.1.0"
edition = "2024"
description = "Ultra-low-latency voice agent harness for Raspberry Pi 4"
license = "MIT"

[lib]
name = "hermit"
path = "src/lib.rs"

[[bin]]
name = "hermit"
path = "src/main.rs"

[features]
# Default builds cleanly on a dev machine (macOS/x86 Linux) so `cargo check` and the
# integration tests run without ALSA or the Picovoice native library present.
default = []

# What the Pi actually ships with. `cross build --release --features pi`.
pi = ["alsa-audio", "wake-porcupine", "wake-onnx", "systemd"]

alsa-audio = ["dep:alsa"]
# Porcupine is bound through its stable C ABI, loaded at runtime with dlopen.
# Picovoice deleted their Rust binding (crates.io `pv_porcupine` is an empty 0.0.0
# placeholder and the repo no longer has binding/rust), so there is no maintained
# crate to depend on. dlopen also means a missing/incompatible .so degrades to
# "wake word disabled" instead of refusing to boot. See src/speech/wake.rs.
wake-porcupine = ["dep:libloading"]
# "Hey Sudo": the project's own livekit-wakeword/openWakeWord-style model. Three ONNX
# graphs (mel -> embedding -> classifier) run through onnxruntime, which is dlopen'd
# at runtime (`load-dynamic`) so a missing libonnxruntime.so degrades to "wake word
# disabled" exactly like the Porcupine path. See src/speech/wake_onnx.rs.
wake-onnx = ["dep:ort"]
systemd = ["dep:sd-notify"]

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "http2",
    "json",
    "stream",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
    "handshake",
] }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
bytes = "1.12.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

rusqlite = { version = "0.40.2", features = ["bundled"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

notify = "8.2.0"
feed-rs = "2.4.0"
regex = "1.13.1"
once_cell = "1.21.4"
anyhow = "1.0.104"
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive"] }
chrono = { version = "0.4.45", features = ["clock"] }
rand = "0.10.2"
urlencoding = "2.1.3"

# Optional / platform-gated.
alsa = { version = "0.12.1", optional = true }
libloading = { version = "0.8", optional = true }
sd-notify = { version = "0.5.0", optional = true }
base64 = "0.23.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
ndarray = "0.17.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tempfile = "3"

[profile.release]
# The Pi has 1GB of RAM and no swap worth speaking of. Optimize for a small,
# fast binary; LTO + one codegen unit is worth the longer cross-compile.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
