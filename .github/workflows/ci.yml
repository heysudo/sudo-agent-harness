name: CI

# The test suite is the spec (memory firewall, skill quarantine, latency
# budgets are all acceptance-tested). This workflow makes it a gate instead
# of a habit. Kept deliberately cheap: fmt + clippy + tests only — the arm64
# device artifact is built and deployed from a dev machine via
# hermit/scripts/build-pi.sh, not from CI.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermit
    steps:
      - uses: actions/checkout@v4

      # ALSA headers are needed only because the crate's host build touches
      # alsa-sys. apt on the runners occasionally stalls for 10+ minutes on a
      # mirror; bound it and retry once rather than burning the job's budget.
      - name: Install ALSA headers (host-feature build deps)
        timeout-minutes: 4
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev \
            || (sleep 5 && sudo apt-get install -y --no-install-recommends libasound2-dev)

      # The single source of truth for the compiler version is
      # hermit/rust-toolchain.toml; rustup reads it (channel + components)
      # when invoked from that directory, so nothing is duplicated here.
      - name: Rust toolchain (from hermit/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermit

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test

      # The strict latency gates (recall p50 < 5ms, harness overhead < 15ms)
      # describe the OPTIMIZED binary. Under `cargo test` they relax to blowup
      # ceilings, because a debug build on a shared runner measures the runner
      # (it failed at 5.47ms against the 5ms gate while the code was fine).
      # Release mode is where those budgets mean something, so enforce them
      # here. scripts/bench.sh on real hardware remains authoritative.
      - name: tests (perf profile — enforces the real latency budgets)
        run: cargo test --profile perf
