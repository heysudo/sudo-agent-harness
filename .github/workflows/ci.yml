name: CI

# The test suite is the spec (memory firewall, skill quarantine, latency
# budgets are all acceptance-tested). This workflow makes it a gate instead
# of a habit. Kept deliberately cheap: fmt + clippy + tests only — the arm64
# device artifact is built and deployed from a dev machine via
# hermit/scripts/build-pi.sh, not from CI.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermit
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (host-feature build deps)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Rust toolchain (pinned by hermit/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermit

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test
