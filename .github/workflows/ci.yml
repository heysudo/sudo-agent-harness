name: CI

# The test suite is the spec (memory firewall, skill quarantine, latency
# budgets are all acceptance-tested). This workflow makes it a gate instead
# of a habit.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermit
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (host-feature build deps)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Rust toolchain (pinned by hermit/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermit

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test

  pi-build:
    name: cross-build arm64 (pi features)
    runs-on: ubuntu-latest
    # The deployable artifact is aarch64 with `--features pi`; a PR that only
    # compiles on the host can still break the device build.
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross toolchain + ALSA headers
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main universe" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermit
          key: pi-arm64

      - name: Build (release, pi features)
        working-directory: hermit
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: cargo build --release --target aarch64-unknown-linux-gnu --features pi
